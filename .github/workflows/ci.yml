name: CI

on:
  push:
    branches: [master]
  pull_request: # any base branch, so stacked PRs are checked too

# A newer push to the same ref supersedes an in-flight run — but never cancel
# a run on master, so a deploy that's already started isn't cut off mid-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # Scans only the commits introduced by this push/PR, not the repo's full
  # history — see motive-backend/.github/workflows/ci.yml's copy of this job
  # for why (a real credential was committed and later deleted in that
  # repo's history before this existed; scanning only what's new is what
  # prevents a repeat without permanently red-X'ing CI over an
  # already-rotated leak).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npm run build

  # The browser tests (Playwright, real Chromium) against the REAL backend and a
  # throwaway Postgres: session survives a reload, stored and pasted XSS payloads
  # do nothing, onboarding, the branded status page, client feedback and sign-offs,
  # and an accessibility audit of every main screen in both themes. The backend is
  # the public sibling repository at its master branch; the database lives only for
  # this job and is never a real one.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://ci:ci-only-throwaway@localhost:5432/ci
      E2E_API_DIR: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mahi0601/motive-backend
          ref: master
          path: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - name: Prepare the backend and its database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci-only-throwaway@localhost:5432/ci
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Deploys only after every check above passed, and only for a push to master.
  # This static site is connected to Render as a public-repo deploy, so it has
  # no push webhook and never auto-deploys; this job is what ships it.
  #
  # Needs RENDER_DEPLOY_HOOK_URL (Render → motive-app → Settings → Deploy Hook)
  # as a secret of the `render-production` GitHub environment, restricted to
  # the master branch. (Not `production`: that name is also Vercel's, which
  # would share, and could be granted, the same secrets.) The hook URL is a
  # credential: keep it in GitHub secrets, never in the repo. `permissions: {}`
  # — the job only calls curl and needs no access to this repository.
  deploy:
    needs: [secret-scan, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions: {}
    environment: render-production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      # Smoke check only: the old version keeps serving until the new build is
      # live, so a pass means the site is up, not that the rollout finished.
      - name: Smoke-check site
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null https://motive-app-stsv.onrender.com; then exit 0; fi
            sleep 20
          done
          echo "Site did not respond in time" >&2
          exit 1
