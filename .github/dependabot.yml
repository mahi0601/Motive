version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Tailwind 4 breaks `vite build` with this config (PostCSS plugin moved
    # out of the main package); migrate on purpose, not through a bump.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per week for routine patch/minor bumps instead of one per
      # package.
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["patch", "minor"]
  # Actions are pinned to commit SHAs (a tag can be moved); Dependabot keeps
  # the SHAs and their version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
