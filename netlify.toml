# Netlify deploy config for the Motive web app (Vite static build + PWA).
# Backend stays on Render — see motive-backend/render.yaml. Set VITE_API_BASE_URL
# in Netlify's dashboard (Site settings → Environment variables) or via
# `netlify env:set VITE_API_BASE_URL https://motive-api-u7xg.onrender.com`
# before the first deploy; Vite inlines it at build time.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# SPA fallback — every non-file path serves index.html so client-side routing
# (react-router) handles the path instead of Netlify 404ing it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker / manifest, or PWA updates won't reach clients.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Security headers on every response. The CSP is enforced. Everything that
# doesn't depend on this deploy's API origin is locked down (no plugins, no
# foreign frames or base URLs, images only from this origin/data:/blob:, forms
# only back to this origin). `connect-src` deliberately stays `https: wss:`:
# VITE_API_BASE_URL is set per-environment in Netlify's dashboard, so this
# file can't name it, and guessing wrong would break every API/socket call.
# If you know your API origin, replace `https: wss:` with it (see the README's
# "Tightening the CSP" section). The inline theme-flash script in index.html
# is why `script-src` still allows 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src https://www.youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'"
