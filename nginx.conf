server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────
    # `always` so these still land on error responses (4xx/5xx), not just 200s.
    # At the server level (not inside a location{}) so every response gets
    # them — nginx quirk: a location block that sets its own add_header stops
    # inheriting the server's, but none of the locations below do that.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Browsers only honor this over an actual HTTPS connection, so it's a
    # no-op (not a risk) if this container is ever hit directly over plain
    # HTTP — safe to always send, whether or not TLS terminates here or at a
    # reverse proxy in front of this container.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Enforced. Everything that doesn't depend on this deploy's API origin is
    # locked down (no plugins, no foreign frames or base URLs, images only from
    # this origin/data:/blob:, forms only back to this origin). `connect-src`
    # deliberately stays `https: wss:`: the app calls its API + Socket.io at
    # VITE_API_BASE_URL, a build-time value the self-hosting operator picks
    # (docker-compose.yml's default is a different origin/port than this
    # nginx server itself), so a static file can't name it and guessing wrong
    # would break every API call. If you know it, replace `https: wss:` with
    # that origin (see the README's "Tightening the CSP"). The inline
    # theme-flash-prevention script in index.html is why `script-src` still
    # allows 'unsafe-inline' — hashing it is brittle, the hash would change
    # every time that script's text does.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src https://www.youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'" always;

    # SPA routing — every non-file path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker, its registrar, the manifest, or the shell —
    # otherwise PWA updates won't reach installed clients.
    location = /sw.js          { add_header Cache-Control "no-cache"; }
    location = /registerSW.js  { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html     { add_header Cache-Control "no-cache"; }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy REST API to the backend on :8080.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io connects to the origin root at /socket.io/, not /api — this
    # location was missing entirely, so a deployment that actually routes
    # through this nginx (VITE_API_BASE_URL built as this server's own
    # origin, not straight at the backend container like docker-compose.yml
    # does by default) would have every live-collab/notification socket
    # silently fail to connect. Same upgrade headers as /api above — the
    # WebSocket handshake needs them here too.
    location /socket.io/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
