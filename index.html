<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/motive.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E4C5C" />
    <meta name="description" content="Motive — client-ready project delivery for small agencies. Run your work on a board; your client gets a live status page." />
    <!-- Social share preview — none of these existed before; every shared
         client status link previewed blank. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Motive" />
    <meta property="og:description" content="Client-ready project delivery for small agencies. Stop writing update emails." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Motive" />
    <meta name="twitter:description" content="Client-ready project delivery for small agencies." />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    <!-- iOS installable web app -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Motive" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Motive — client-ready project delivery</title>
    <script>
      // Apply theme before React mounts to avoid a flash of the wrong theme.
      // Defaults to dark unless the user has explicitly chosen light.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.classList.toggle('dark', t !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
